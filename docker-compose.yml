version: "3.8"

services:
  # Main Next.js Application
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=production
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - REDIS_URL=redis://redis:6379
      - TURN_SERVER_URL=turn:coturn:3478
      - TURN_USERNAME=${TURN_USERNAME:-livekit}
      - TURN_PASSWORD=${TURN_PASSWORD:-password}
    depends_on:
      - livekit
      - redis
      - coturn
    networks:
      - webrtc-network
    restart: unless-stopped

  # LiveKit Server for WebRTC signaling and media routing
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"   # WebSocket
      - "7881:7881"   # HTTP
      - "7882:7882"   # TURN/STUN
    volumes:
      - ./config/livekit.yaml:/livekit.yaml
    environment:
      - LIVEKIT_CONFIG=/livekit.yaml
    command: --config /livekit.yaml --bind 0.0.0.0
    networks:
      - webrtc-network
    restart: unless-stopped
    depends_on:
      - redis

  # COTURN server for STUN/TURN functionality (NAT traversal)
  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478"     # STUN/TURN TCP
      - "3478:3478/udp" # STUN/TURN UDP
      - "5349:5349"     # STUNS/TURNS TCP
      - "5349:5349/udp" # STUNS/TURNS UDP
      - "49152-65535:49152-65535/udp" # Media relay ports
    volumes:
      - ./config/turnserver.conf:/etc/turnserver.conf
    command: -c /etc/turnserver.conf
    networks:
      - webrtc-network
    restart: unless-stopped

  # Redis for session management and real-time features
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - webrtc-network
    restart: unless-stopped

  # Nginx reverse proxy for SSL termination and load balancing
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - nginx-cache:/var/cache/nginx
    depends_on:
      - app
      - livekit
    networks:
      - webrtc-network
    restart: unless-stopped

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - webrtc-network
    restart: unless-stopped

volumes:
  redis-data:
  nginx-cache:
  prometheus-data:

networks:
  webrtc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
