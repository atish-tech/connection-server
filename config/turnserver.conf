# TURN server configuration for WebRTC NAT traversal

# Listening interfaces
listening-port=3478
tls-listening-port=5349

# External IP (will be auto-detected in Docker)
# external-ip=YOUR_PUBLIC_IP

# Relay interfaces
relay-device=eth0
relay-ip=0.0.0.0

# Authentication
use-auth-secret
static-auth-secret=livekit-turn-secret

# User credentials for TURN authentication
user=livekit:password

# Realm for authentication
realm=livekit.io

# SSL/TLS certificates (for TURNS)
# cert=/etc/ssl/certs/turn_server_cert.pem
# pkey=/etc/ssl/private/turn_server_pkey.pem

# Logging
log-file=/var/log/turn.log
verbose

# Security settings
fingerprint
lt-cred-mech

# Deny loopback and private IP addresses
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Allow specific local network ranges (adjust as needed)
allowed-peer-ip=172.20.0.0-172.20.255.255

# Performance settings
max-bps=1000000
bps-capacity=0
stale-nonce=600
max-allocate-lifetime=3600
channel-lifetime=600
permission-lifetime=300

# Database settings (optional - for persistent storage)
# userdb=/etc/turnuserdb.conf

# Mobility support
mobility

# Additional security
no-multicast-peers
no-cli
no-loopback-peers
no-stdout-log

# Process settings
pidfile=/var/run/turnserver.pid

# Quota settings
user-quota=12
total-quota=1200