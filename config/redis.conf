# Redis configuration for WebRTC application

# Network settings
bind 0.0.0.0
port 6379
protected-mode no

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence settings (for session data)
save 900 1
save 300 10
save 60 10000

# Disable RDB compression for faster saves
rdbcompression no

# Enable AOF for better durability
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Logging
loglevel notice
logfile ""

# Performance tuning
tcp-keepalive 300
timeout 0

# Pub/Sub settings for real-time features
notify-keyspace-events Ex

# Client settings
tcp-backlog 511
maxclients 10000

# Security (basic - enhance for production)
# requirepass your_redis_password

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100

# Memory usage optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation
hll-sparse-max-bytes 3000

# Streams settings for real-time data
stream-node-max-bytes 4096
stream-node-max-entries 100

# Replica settings (for clustering)
replica-serve-stale-data yes
replica-read-only yes

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command DEBUG ""

# Enable keyspace notifications for session management
notify-keyspace-events "Ex"